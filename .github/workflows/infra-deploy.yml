# Actions are pinned to commit SHAs (version in the comment), checked against each repo's
# latest release on Sep 27, 2026; all run on node24.
# Deploys only the persistent stack (stack ID PersistentStack). Its role could deploy any stack
# through the CDK deploy role, the app stack included: only this file and the owner's approval on
# the `infra` Environment keep it to the persistent stack.
name: infra-deploy

on:
  workflow_dispatch:

permissions: {}

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: infra
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # expiresAt is only needed so the app stack in the same CDK app can synth; it is not deployed.
      # alertEmail comes from a repo variable, never from the repo itself.
      - env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: |
          pnpm --filter infra exec cdk deploy PersistentStack --exclusively \
            --require-approval never \
            -c alertEmail="$ALERT_EMAIL" \
            -c expiresAt="$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ)"
