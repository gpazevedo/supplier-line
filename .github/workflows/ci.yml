# Actions are pinned to commit SHAs (version in the comment), checked against each repo's
# latest release on Sep 27, 2026; all run on node24.
# No AWS credentials and no id-token permission, by design.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pipx install pre-commit
      - run: pre-commit run --all-files --hook-stage pre-commit
      - run: pre-commit run --all-files --hook-stage pre-push

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: supplier-line-host:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image must start, not only build: wait for its own HEALTHCHECK, under QEMU.
      - run: |
          docker run -d --name host -e DEMO_ACCESS_CODE=ci-only supplier-line-host:ci
          for _ in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' host)" = healthy ] && exit 0
            [ "$(docker inspect -f '{{.State.Running}}' host)" = true ] || break
            sleep 5
          done
          docker logs host
          exit 1
